
name: Build Onboard AppImage

on:
  workflow_dispatch:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            pkg-config \
            python3 \
            python3-dev \
            python3-distutils-extra \
            python3-gi \
            python3-gi-cairo \
            python3-cairo \
            python3-dbus \
            python3-xlib \
            python3-evdev \
            libgtk-3-dev \
            libxtst-dev \
            libxkbfile-dev \
            libdconf-dev \
            libcanberra-dev \
            libhunspell-dev \
            libudev-dev \
            patchelf \
            desktop-file-utils \
            squashfs-tools \
            fakeroot \
            strace \
            zsync \
            libgdk-pixbuf-2.0-dev

      - name: Install appimage-builder
        run: |
          python3 -m pip install --break-system-packages appimage-builder

      - name: Determine version
        id: version
        run: |
          VERSION="$(git describe --tags --always 2>/dev/null || git rev-parse --short HEAD)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create AppImage recipe
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          cat > AppImageBuilder.yml <<'YAML'
          version: 1

          script:
            - rm -rf AppDir
            - mkdir -p AppDir
            - python3 setup.py clean
            - python3 setup.py build
            - python3 setup.py install --root="$TARGET_APPDIR" --prefix=/usr

          AppDir:
            path: ./AppDir

            app_info:
              id: org.onboard.Onboard
              name: Onboard
              icon: onboard
              version: "{{APP_VERSION}}"
              exec: usr/bin/python3
              exec_args: "$APPDIR/usr/bin/onboard $@"

            apt:
              arch: amd64
              sources:
                - sourceline: 'deb [arch=amd64] http://archive.ubuntu.com/ubuntu/ jammy main universe'
                  key_url: 'https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x3B4FE6ACC0B21F32'

              include:
                - python3
                - python3-gi
                - python3-gi-cairo
                - python3-cairo
                - python3-dbus
                - python3-xlib
                - python3-evdev
                - gir1.2-gtk-3.0
                - libgtk-3-0
                - libxtst6
                - libxkbfile1
                - libdconf1
                - libcanberra-gtk3-module
                - libhunspell-1.7-0
                - libudev1
                - dconf-gsettings-backend

              exclude: []

            runtime:
              env:
                PYTHONHOME: '${APPDIR}/usr'
                PYTHONPATH: '${APPDIR}/usr/lib/python3/dist-packages:${APPDIR}/usr/lib/python3.10/site-packages'

            files:
              exclude:
                - usr/share/doc/*
                - usr/share/man/*
                - usr/share/locale/*/LC_MESSAGES/*

          AppImage:
            arch: x86_64
            file_name: Onboard-{{APP_VERSION}}-x86_64.AppImage
          YAML

          sed -i "s/{{APP_VERSION}}/${APP_VERSION}/g" AppImageBuilder.yml

      - name: Build AppImage
        run: |
          appimage-builder --recipe AppImageBuilder.yml --skip-test

      - name: Check output
        run: |
          find . -maxdepth 1 -name '*.AppImage' -type f -print
          test -n "$(find . -maxdepth 1 -name '*.AppImage' -type f)"

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: onboard-appimage
          path: "*.AppImage"
          if-no-files-found: error
          retention-days: 30
